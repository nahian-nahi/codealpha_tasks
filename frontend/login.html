<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — General Store</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">General<span class="dot">·</span>Store</a>
    <nav class="nav-links">
      <a href="index.html">Shop</a>
      <a href="cart.html">Cart <span class="cart-badge" id="cart-badge">0</span></a>
      <span id="user-chip"></span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <h1>Welcome back</h1>
  <p class="sub">Log in to check out and view your orders.</p>

  <p id="form-alert" class="alert"></p>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
  </form>

  <p class="switch-link">Don't have an account? <a href="register.html" id="switch-link">Sign up</a></p>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
